  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0a;
      color: white;
      margin: 0;
    }

    /* ─── 3D Circular Animated Loader ─── */
    .fn-loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 9999999;
      background-color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fn-loader-overlay.fn-loader-hidden {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }
    .fn-loader-backdrop {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, rgba(10, 10, 10, 0) 70%);
      pointer-events: none;
      animation: fnPulse 3s ease-in-out infinite alternate;
    }
    .fn-loader-card {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .fn-spinner-wrap {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .fn-orbit-outer {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px dashed rgba(16, 185, 129, 0.28);
      animation: fnCounterSpin 14s linear infinite;
    }
    .fn-svg-ring {
      width: 160px;
      height: 160px;
      transform: rotate(-90deg);
      display: block;
    }
    .fn-ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 3.5;
    }
    .fn-ring-active {
      fill: none;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 440;
      stroke-dashoffset: 110;
      transform-origin: center;
      animation: fnSpin 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .fn-ring-inner {
      fill: none;
      stroke: rgba(16, 185, 129, 0.25);
      stroke-width: 1.5;
      stroke-dasharray: 8 16;
      transform-origin: center;
      animation: fnCounterSpin 9s linear infinite;
    }
    .fn-3dlogo-box {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .fn-3dlogo-img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(16, 185, 129, 0.4));
      animation: fnFloat 2.6s ease-in-out infinite alternate;
      user-select: none;
      -webkit-user-drag: none;
    }
    .fn-loader-text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .fn-loader-brand {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.25em;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    }
    .fn-loader-progress-track {
      width: 160px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .fn-loader-progress-bar {
      position: absolute;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, transparent, #10b981, #34d399, transparent);
      border-radius: 999px;
      animation: fnProgress 1.6s ease-in-out infinite;
    }
    .fn-loader-subtext {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.02em;
    }
    @keyframes fnSpin {
      0% {
        stroke-dashoffset: 400;
        transform: rotate(0deg);
      }
      50% {
        stroke-dashoffset: 120;
        transform: rotate(180deg);
      }
      100% {
        stroke-dashoffset: 400;
        transform: rotate(360deg);
      }
    }
    @keyframes fnCounterSpin {
      100% {
        transform: rotate(-360deg);
      }
    }
    @keyframes fnFloat {
      0% {
        transform: translateY(0px) scale(1);
        filter: drop-shadow(0 8px 20px rgba(16, 185, 129, 0.3));
      }
      100% {
        transform: translateY(-8px) scale(1.05);
        filter: drop-shadow(0 18px 32px rgba(16, 185, 129, 0.55));
      }
    }
    @keyframes fnPulse {
      0% {
        transform: scale(0.9);
        opacity: 0.5;
      }
      100% {
        transform: scale(1.15);
        opacity: 1;
      }
    }
    @keyframes fnProgress {
      0% {
        left: -50%;
      }
      100% {
        left: 100%;
      }
    }
    @media (max-width: 640px) {
      .fn-spinner-wrap {
        width: 135px;
        height: 135px;
        margin-bottom: 20px;
      }
      .fn-svg-ring {
        width: 135px;
        height: 135px;
      }
      .fn-3dlogo-img {
        width: 80px;
        height: 80px;
      }
      .fn-loader-brand {
        font-size: 13px;
        letter-spacing: 0.2em;
      }
      .fn-loader-progress-track {
        width: 135px;
      }
    }
  </style>
</head>

<body>
  <!-- Initial 3D Logo Circular Loading Screen -->
  <div id="fn-initial-loader" class="fn-loader-overlay">
    <div class="fn-loader-backdrop"></div>
    <div class="fn-loader-card">
      <div class="fn-spinner-wrap">
        <div class="fn-orbit-outer"></div>
        <svg class="fn-svg-ring" viewBox="0 0 160 160">
          <defs>
            <linearGradient id="fnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#10b981" />
              <stop offset="50%" stop-color="#34d399" />
              <stop offset="100%" stop-color="#059669" />
            </linearGradient>
            <filter id="fnRingGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.65" />
            </filter>
          </defs>
          <circle class="fn-ring-bg" cx="80" cy="80" r="70" />
          <circle class="fn-ring-active" cx="80" cy="80" r="70" stroke="url(#fnGrad)" filter="url(#fnRingGlow)" />
          <circle class="fn-ring-inner" cx="80" cy="80" r="62" />
        </svg>
        <div class="fn-3dlogo-box">
          <img src="/logo3d.png" alt="Forex Notes" class="fn-3dlogo-img" />
        </div>
      </div>
      <div class="fn-loader-text-group">
        <div class="fn-loader-brand">FOREX NOTES</div>
        <div class="fn-loader-progress-track">
          <div class="fn-loader-progress-bar"></div>
        </div>
        <div class="fn-loader-subtext">Initializing Platform & 10-Year Market Data...</div>
      </div>
    </div>
  </div>

  <div id="root"></div>

  <noscript>
    <h1>Forex Notes: Backtesting, Trading Journal and AI Coach</h1>
    <p>Bar replay backtesting on 10 years of data, a digital trading journal with an AI psychology coach, and prop firm tools for forex, gold and crypto traders. Enable JavaScript to use the app.</p>
  </noscript>

  <script>
    (function () {
      var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || null;
      var isReload = nav ? nav.type === 'reload' : (performance.navigation && performance.navigation.type === 1);
      var path = window.location.pathname.replace(/\/$/, '');
      var isLanding = path === '' || path === '/';

      // 5 sec on initial landing entry, 3 sec on every page refresh / reload
      var targetDuration = (isLanding && !isReload) ? 5000 : 3000;
      var startTime = Date.now();

      window.__targetLoaderDuration = targetDuration;
      window.__loaderStartTime = startTime;

      window.__dismissLoader = function (forceImmediate) {
        var loader = document.getElementById('fn-initial-loader');
        if (!loader || loader.classList.contains('fn-loader-hidden')) return;

        var elapsed = Date.now() - startTime;
        var remaining = forceImmediate ? 0 : Math.max(0, targetDuration - elapsed);

        setTimeout(function () {
          if (!loader || loader.classList.contains('fn-loader-hidden')) return;
          loader.classList.add('fn-loader-hidden');
          setTimeout(function () {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 550);
        }, remaining);
      };

      // Safety fallback: dissolve after targetDuration + 2000ms in case script hangs
      setTimeout(function () {
        if (typeof window.__dismissLoader === 'function') {
          window.__dismissLoader(true);
        }
      }, targetDuration + 2000);
    })();
  </script>
