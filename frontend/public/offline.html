<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Offline | Forex Notes</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0a; color: #fff; padding: 24px; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; text-align: center;
    }
    img { width: 88px; height: 88px; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: rgba(255, 255, 255, 0.6); font-size: 14px; line-height: 1.5; max-width: 320px; margin: 0 auto 24px; }
    button {
      background: #10b981; color: #fff; border: 0; border-radius: 999px;
      padding: 12px 28px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/logo-192.png" alt="Forex Notes" />
    <h1>You're offline</h1>
    <p>Forex Notes needs a connection to sync your trades and market data. Check your internet and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
