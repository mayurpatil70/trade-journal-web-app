<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trade Journey</title>
  <link rel="stylesheet" href="assets/app.css">
</head>

<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brandmark">TJ</div>
        <div><b>Trade Journey</b><small>Private trading journal</small></div>
      </div>
      <nav>
        <button class="nav active" data-page="dashboard"><span class="nav-icon icon-dashboard" aria-hidden="true"><svg
              viewBox="0 0 24 24">
              <path d="M4 13h6V4H4v9Zm10 7h6V4h-6v16ZM4 20h6v-3H4v3Z" />
              <path d="M14 20v-3h6" />
            </svg></span><span>Dashboard</span></button>
        <button class="nav" data-page="add"><span class="nav-icon icon-add" aria-hidden="true"><svg viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14" />
            </svg></span><span>Add Trade</span></button>
        <button class="nav" data-page="trades"><span class="nav-icon icon-trades" aria-hidden="true"><svg
              viewBox="0 0 24 24">
              <rect x="4" y="4" width="16" height="16" rx="3" />
              <path d="M8 8h8M8 12h8M8 16h5" />
            </svg></span><span>Past Trades</span></button>
        <button class="nav" data-page="calendar"><span class="nav-icon icon-calendar" aria-hidden="true"><svg
              viewBox="0 0 24 24">
              <rect x="4" y="5" width="16" height="15" rx="3" />
              <path d="M8 3v4M16 3v4M4 9h16M8 13h2M12 13h2M16 13h.01M8 17h2M12 17h2" />
            </svg></span><span>Calendar</span></button>
        <button class="nav" data-page="analytics"><span class="nav-icon icon-analytics" aria-hidden="true"><svg
              viewBox="0 0 24 24">
              <path d="M5 19V10M12 19V5M19 19v-7" />
            </svg></span><span>Analytics</span></button>
        <button class="nav" data-page="vault"><span class="nav-icon icon-vault" aria-hidden="true"><svg
              viewBox="0 0 24 24">
              <rect x="3.5" y="5" width="17" height="14" rx="3" />
              <circle cx="9" cy="11" r="2" />
              <path d="m5 17 4.5-4 3.2 3 2.2-2 4.1 3" />
            </svg></span><span>Chart Vault</span></button>
        <button class="nav" data-page="customize"><span class="nav-icon icon-customize" aria-hidden="true"><svg
              viewBox="0 0 24 24">
              <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
              <circle cx="16" cy="7" r="2" />
              <circle cx="8" cy="17" r="2" />
            </svg></span><span>Customize</span></button>
        <button class="nav" data-page="settings"><span class="nav-icon icon-settings" aria-hidden="true"><svg
              viewBox="0 0 24 24">
              <path
                d="M12 3l1.4 2.1 2.5.5.7 2.5 2.1 1.4-1.1 2.3 1.1 2.3-2.1 1.4-.7 2.5-2.5.5L12 21l-1.4-2.1-2.5-.5-.7-2.5-2.1-1.4 1.1-2.3-1.1-2.3 2.1-1.4.7-2.5 2.5-.5L12 3Z" />
              <circle cx="12" cy="12" r="3" />
            </svg></span><span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="dot"></span> Local & private</div>
    </aside>

    <main class="main">
      <header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button>
        <div>
          <div class="eyebrow">TRADING JOURNAL</div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="top-actions"><button class="ghost" id="quickAddTrade">⚡ Quick Add</button><button class="ghost"
            id="quickAdd">＋ Add Trade</button><button class="avatar">TJ</button></div>
      </header>

      <section id="dashboard" class="page active"></section>
      <section id="add" class="page"></section>
      <section id="trades" class="page"></section>
      <section id="calendar" class="page"></section>
      <section id="analytics" class="page"></section>
      <section id="vault" class="page"></section>
      <section id="customize" class="page"></section>
      <section id="settings" class="page"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card"><button class="modal-close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <input id="imagePicker" type="file" accept="image/*" multiple hidden>
  <script src="assets/app.js"></script>

  <div id="quickPanel" class="quick-panel hidden">
    <div class="section-head">
      <h3>⚡ Quick Add Trade</h3><button class="ghost" id="quickClose">×</button>
    </div>
    <div class="qrow">
      <div><label>Asset</label><select id="qAsset">
          <option>XAUUSD</option>
          <option>NAS100</option>
          <option>GER40</option>
          <option>US30</option>
          <option>EURUSD</option>
          <option>GBPUSD</option>
          <option>BTCUSD</option>
        </select></div>
      <div><label>Result</label><select id="qResult">
          <option value="win">WIN</option>
          <option value="loss">LOSS</option>
          <option value="be">BE</option>
        </select></div>
      <div><label>Setup</label><input id="qSetup" placeholder="FVG / SMT / Liquidity"></div>
      <div><label>R</label><input id="qR" type="number" step="0.1" placeholder="1.5"></div>
    </div>
    <div class="form-actions"><button class="primary" id="qSave">Save Quick Trade</button></div>
  </div>
</body>

</html>
